<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <radialGradient id="orb" cx="75%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" />
  <rect width="800" height="800" fill="url(#orb)" />

  <!-- Subtle Geometric Frame -->
  <rect x="44" y="44" width="712" height="712" rx="48" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

  <!-- Top Pill -->
  <rect x="84" y="84" width="240" height="44" rx="22" fill="#84CC16" fill-opacity="0.18" stroke="#84CC16" stroke-opacity="0.55" />
  <text x="204" y="112" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">CREATIVE ASSETS</text>

  <!-- Verified Shield Tag -->
  <rect x="556" y="84" width="160" height="44" rx="22" fill="#0F172A" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.15" />
  <text x="636" y="112" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">✓ OFFICIAL</text>

  <!-- Center Floating Emblem Card -->
  <g transform="translate(140, 185)">
    <rect x="0" y="0" width="520" height="310" rx="40" fill="url(#accent)" />
    <rect x="16" y="16" width="488" height="278" rx="30" fill="#060A12" fill-opacity="0.32" stroke="#FFFFFF" stroke-opacity="0.22" />
    <text x="260" y="155" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">Envato</text>
    <text x="260" y="225" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700" opacity="0.92">INSTANT AUTO DELIVERY</text>
  </g>

  <!-- Product Title & Subtitle Footer -->
  <text x="400" y="590" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900">Envato Elements</text>
  <text x="400" y="640" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="24" font-weight="600">Unlimited Stock Video · Themes · Fonts</text>

  <!-- Bottom Warranty Bar -->
  <rect x="170" y="675" width="460" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14" />
  <text x="400" y="705" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="17" font-weight="700">DDS-DIGITAL · 100% WARRANTY GUARANTEED</text>
</svg>